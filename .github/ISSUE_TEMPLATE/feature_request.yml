name: Feature Request
description: Suggest an idea, enhancement, or new feature for Lumen.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for Lumen! Please describe your use case and proposed design.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you considered.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, API design snippets, or screenshots here.
